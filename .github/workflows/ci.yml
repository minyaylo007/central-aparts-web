name: CI

# Публічний репо: секретів цей workflow не використовує взагалі (permissions: contents: read,
# жодного secrets.*). Тригер — pull_request (НЕ pull_request_target): PR із форків не
# отримують ні секретів, ні права на запис. lint, test і smoke (fake) — на кожен PR, push у
# master і вручну. Live-смоки (справжній бек-офіс) тут немає і не буде.
# Прод цей workflow НЕ викочує. Залежності — лише з файлів проєкту: requirements-dev.txt
# (lint, test), requirements.lock і e2e/package-lock.json (smoke).
# Actions прибиті за sha (захист від підміни тегу), версія — у коментарі поруч.
on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch: {}

# Новий push у ту саму гілку (або PR) скасовує застарілий прогін — крім master:
# там кожен коміт має власну групу (за sha) і прогін завжди доходить до кінця.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # ruff: лише справжні помилки (E9, F) — ruff.toml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      # e2e/test_fake_transport.py — самоперевірка підміни для заміру (pytest, без браузера)
      - name: Tests
        run: python -m pytest tests/ e2e/test_fake_transport.py -q

  # Playwright-смока сайту в режимі fake: справжній gunicorn + підмінний бек-офіс,
  # без мережі (сторонні запити глушить e2e/tests/fixtures.ts). Див. e2e/README.md.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install site
        working-directory: .
        # Ті самі точні версії з хешами, що й на проді.
        run: pip install --require-hashes -r requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install smoke
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke (fake backoffice)
        run: npx playwright test
        env:
          SMOKE_BACKEND: fake
          SMOKE_PYTHON: python
      # у публічному репо артефакт бачать усі: у звіті лише fake-дані й 127.0.0.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
