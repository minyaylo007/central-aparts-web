<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Статистика{% endblock %} · Central Square</title>
<link rel="stylesheet" href="{{ static_url('styles.css') }}">
<style>
  /* Панель /stats — лише токени з styles.css :root */
  body.stats { background: var(--greige); color: var(--ink); font-family: var(--font-body); font-size: 14px; margin: 0; }
  .stats-wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .stats-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .stats-top h1 { font-family: var(--font-display); font-size: 1.9rem; margin: 0; }
  .stats-top nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stats-top nav a, .stats-btn { border: 1px solid var(--line); background: var(--cream); color: var(--ink); padding: 4px 10px; border-radius: var(--r-sm); text-decoration: none; font: inherit; cursor: pointer; }
  .stats-top nav a.on { background: var(--espresso); color: var(--cream-text); border-color: var(--espresso); }
  .card-s { background: var(--cream); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .card-s h2 { font-family: var(--font-display); font-size: 1.45rem; margin: 0 0 4px; }
  .card-s .hint { color: var(--stone); margin: 0 0 12px; font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--cream); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
  .tile b { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--stone); font-size: 13px; }
  table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.t th { text-align: left; color: var(--stone); font-weight: 500; border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
  table.t td { border-bottom: 1px solid var(--line-soft); padding: 6px 8px; vertical-align: top; }
  table.t td.num, table.t th.num { text-align: right; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .bar { height: 14px; background: var(--clay); border-radius: 0 var(--r-sm) var(--r-sm) 0; min-width: 2px; }
  .bar.alt { background: var(--sage); }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--line); }
  .cols div { flex: 1; background: var(--clay); border-radius: var(--r-xs) var(--r-xs) 0 0; min-height: 1px; }
  .cols div:hover { background: var(--clay-deep); }
  .axis { display: flex; justify-content: space-between; color: var(--stone); font-size: 12px; margin-top: 4px; }
  .muted { color: var(--stone); }
  .bad { color: var(--error); font-weight: 600; }
  .ok { color: var(--success); }
  .warn { color: var(--warning); font-weight: 600; }
  code { font-size: 12px; background: var(--porcelain); padding: 1px 4px; border-radius: var(--r-xs); word-break: break-all; }
  .empty { color: var(--stone); font-style: italic; }
</style>
{% block head %}{% endblock %}
</head>
<body class="stats">
<div class="stats-wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
