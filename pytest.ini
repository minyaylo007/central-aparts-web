# Набір тестів сайту. Два режими прогону — CLAUDE.md, блок «Команди».
#
#   critical — тест стереже гостя, гроші або доступність: ціни й котирування,
#              бронь і оплата, купон, доступність сторінок, дані гостя в журналі,
#              /health (за ним ходить викат і смока). Падіння такого тесту міняє
#              щось для гостя або власника.
#   Без маркера — форма тексту, розмітка, порядок рядків, сторожі інфраструктури
#              розбору та дублі одного предмета. Такі йдуть у повний набір.
[pytest]
testpaths = tests e2e/test_fake_transport.py
markers =
    critical: стереже гостя, гроші або доступність — входить у прогін за замовчуванням
    real_critical_css: тест бачить справжній інлайн-CSS першого екрана (інакше conftest його вимикає)
