{% extends "stats_base.html" %}
{% block title %}Вход{% endblock %}
{% block body %}
<div class="card-s" style="max-width:380px;margin:12vh auto 0;">
  <h2>Статистика сайта</h2>
  <p class="hint">Ключ лежит в site.env (переменная STATS_KEY).</p>
  {% if error %}<p class="bad">Ключ не подошёл или слишком много попыток.</p>{% endif %}
  <form method="post" action="{{ url_for('analytics.stats_login') }}">
    <input type="password" name="key" autocomplete="current-password" required
           style="width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;">
    <button class="stats-btn" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
