# Лінтер сайту: лише справжні помилки, без переформатування коду.
# E9 — синтаксис і помилки читання файла; F — pyflakes (неозначені імена,
# невикористані імпорти й змінні, f-рядки без підстановок тощо).
# Стиль (E1–E7, W, I) навмисно не вмикаємо: це масові правки без користі.
# .gitignore ruff поважає сам — e2e/node_modules і .venv не перевіряються.
target-version = "py312"

[lint]
select = ["E9", "F"]
